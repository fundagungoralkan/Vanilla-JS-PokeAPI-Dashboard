<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex Projesi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="iphone-container">
      <div class="iphone-notch"></div>

      <main class="app-screen">
        <header>
          <div class="menu-icon">
            <span></span>
            <span></span>
          </div>
          <h1 class="main-title">What Pokémon are you looking for?</h1>
        </header>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by ID, Name or Type"
            autocomplete="off"
          />
        </div>

        <p id="status" class="status-text">Loading...</p>

        <div class="poke-grid" id="pokeContainer"></div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
